services:
  db:
    image: postgres:17
    container_name: food-ai-db

    env_file:
      - ./backend/.env

    volumes:
      - food_ai_postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: food-ai-backend

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

    volumes:
      - food_ai_media:/app/media

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --timeout 300
      "
  frontend:
    build:
      context: ./frontend/web

    container_name: food-ai-frontend

    ports:
          - "8080:80"
          - "8443:443"

    depends_on:
      - backend

volumes:
  food_ai_postgres_data:
  food_ai_media: